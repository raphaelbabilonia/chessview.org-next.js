name: Deploy ChessView Website

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/**
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chessview-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install map test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run lint
        run: npm run lint

      - name: Run deterministic map tests
        run: npm run test:maps

      - name: Run consent-first analytics tests
        run: npm run test:analytics

      - name: Run growth foundation tests
        run: npm run test:growth-foundation:unit

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: map-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build standalone website
        env:
          API_BASE_URL: https://api.chessview.org/api
          NEXT_PUBLIC_SITE_URL: https://chessview.org
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENABLED || 'false' }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: /ingest
          CHESSVIEW_DEPLOY_SHA: ${{ github.sha }}
        run: npm run build

      - name: Create deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs
          printf '%s\n' '${{ github.sha }}' > deploy/.deployment-sha

      - name: Package verified release
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/chessview-web.tar.gz" -C deploy .

      - name: Deploy through restricted KVM8 gateway
        env:
          CV_HOST: ${{ secrets.CHESSVIEW_VPS_HOST }}
          CV_USER: ${{ secrets.CHESSVIEW_VPS_USER }}
          CV_KEY: ${{ secrets.CHESSVIEW_VPS_SSH_KEY }}
          CV_KNOWN_HOSTS: ${{ secrets.CHESSVIEW_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CV_KEY" > ~/.ssh/chessview_key
          chmod 600 ~/.ssh/chessview_key
          ssh-keygen -y -f ~/.ssh/chessview_key > /dev/null
          printf '%s\n' "$CV_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ARCHIVE="$RUNNER_TEMP/chessview-web.tar.gz"
          ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)
          ssh -T -i ~/.ssh/chessview_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CV_USER@$CV_HOST" "web $GITHUB_SHA $ARCHIVE_SHA" < "$ARCHIVE"

      - name: Verify public website and release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 -o /dev/null https://chessview.org/en
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 -o /dev/null https://chessview.org/en/events
          DEPLOYED_SHA=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://chessview.org/_health | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).deploymentSha||""))')
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"

